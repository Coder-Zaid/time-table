            query: ""
        };

        function renderPublicationsView(container) {
            const userRole = currentAuthUser ? currentAuthUser.role : "VIEWER";
            const canPublish = userRole === "SUPER_ADMIN" || userRole === "TIMETABLE_ADMIN";

            let html = `
            <div style="max-width: 1380px; margin: 0 auto; padding: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                    <div>
                        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem;">
                            <h2 style="font-size: 20px; font-weight: 700; color: var(--text-primary);">Institutional Timetable Publishing Pipeline</h2>
                            <span class="badge badge-certified">Stage 12 Certified Production</span>
                        </div>
                        <p style="font-size: 13px; color: var(--text-muted);">
                            Only APPROVED immutable timetable versions may be published. Creates isolated, read-only public snapshots.
                        </p>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn-action" style="background: var(--bg-surface); border: 1px solid var(--border-default); color: var(--text-primary);" onclick="switchView('versions')">Version History</button>
                        ${canPublish ? `<button class="btn-action btn-primary" onclick="openPublishModal()">+ Publish Approved Version</button>` : ''}
                    </div>
                </div>

                <div style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 2rem;">
                    <div style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-default); font-weight: 700; font-size: 14px;">Active & Historical Publication Records</div>
                    <table class="master-table">
                        <thead>
                            <tr>
                                <th>Publication Slug / URL</th>
                                <th>Source Version</th>
                                <th>Status</th>
                                <th>Visibility</th>
                                <th>Published Date</th>
                                <th>Publisher</th>
                                <th>Snapshot Fingerprint</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${currentPublications.map(p => `
                                <tr>
                                    <td>
                                        <div style="font-weight: 600; font-size: 13px; color: var(--brand-primary);">${p.title}</div>
                                        <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">/public/${p.public_slug}</div>
                                    </td>
                                    <td>
                                        <span class="badge badge-neutral">v${p.source_version_number}</span>
                                    </td>
                                    <td>
                                        <span class="badge ${p.status === 'PUBLISHED' ? 'badge-certified' : (p.status === 'SUPERSEDED' ? 'badge-rule' : 'badge-neutral')}">${p.status}</span>
                                    </td>
                                    <td>
                                        <span class="badge badge-neutral">${p.visibility}</span>
                                    </td>
                                    <td style="font-size: 12px; color: var(--text-muted);">${new Date(p.published_at).toLocaleDateString()}</td>
                                    <td style="font-size: 12px;">${p.published_by}</td>
                                    <td style="font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted);" title="${p.source_version_fingerprint}">
                                        ${p.source_version_fingerprint.substring(0, 10)}...
                                    </td>
                                    <td>
                                        <div style="display: flex; gap: 0.35rem;">
                                            <button class="btn-action" style="padding: 0.25rem 0.5rem; font-size: 11px; background: var(--brand-primary); color: #FFF; border: none;" onclick="openPublicViewer('${p.public_slug}')">Open Public Viewer</button>
                                            ${canPublish && p.status === 'PUBLISHED' ? `
                                                <button class="btn-action" style="padding: 0.25rem 0.5rem; font-size: 11px; background: var(--bg-surface); border: 1px solid #EF4444; color: #EF4444;" onclick="unpublishAction('${p.publication_id}')">Unpublish</button>
                                            ` : ''}
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            `;
            container.innerHTML = html;
        }

        function openPublishModal() {
            const approved = currentVersionList.filter(v => v.status === "APPROVED");
            if (approved.length === 0) {
                alert("Publication Blocked: Zero versions have status APPROVED. Only approved immutable versions may be published.");
                return;
            }
            const target = approved[approved.length - 1];
            if (!confirm(`Publish Version v${target.version_number} (${target.version_label}) as an immutable public timetable snapshot?`)) return;

            const newSlug = `woxsen-tt-${Math.random().toString(36).substring(2, 7)}`;
            const newPub = {
                publication_id: `pub_${Date.now()}`,
                public_identifier: `pub_${Date.now()}`,
                public_slug: newSlug,
                project_id: "proj_woxsen_canonical",
                source_version_id: target.version_id,
                source_version_number: target.version_number,
                source_version_fingerprint: target.timetable_fingerprint,
                published_at: new Date().toISOString(),
                published_by: currentAuthUser ? currentAuthUser.user_id : "usr_admin",
                status: "PUBLISHED",
                visibility: "PUBLIC",
                title: "Woxsen University — Official Academic Timetable",
                academic_period: "Spring 2026",
                institution_name: "Woxsen University",
                effective_from: "2026-01-05",
                effective_to: "2026-05-30"
            };

            // Supersede previous publications
            currentPublications.forEach(p => {
                if (p.status === "PUBLISHED") p.status = "SUPERSEDED";
            });

            currentPublications.unshift(newPub);
            alert(`Publication Created Successfully!\nPublic URL: /public/${newSlug}`);
            renderPublicationsView(document.getElementById('mainContainer'));
        }

        function unpublishAction(pubId) {
            const pub = currentPublications.find(p => p.publication_id === pubId);
            if (!pub) return;
            if (!confirm(`Are you sure you want to unpublish "${pub.title}"? Public URL will return UNAVAILABLE.`)) return;
            pub.status = "UNPUBLISHED";
            alert("Publication unpublished. Public viewer access deactivated.");
            renderPublicationsView(document.getElementById('mainContainer'));
        }

        function openPublicViewer(slug) {
            const pub = currentPublications.find(p => p.public_slug === slug) || currentPublications[0];
            renderPublicViewerUI(document.getElementById('mainContainer'), pub);
        }

        function renderPublicViewerUI(container, pub) {
            if (pub.status === "UNPUBLISHED") {
                container.innerHTML = `
                <div style="max-width: 800px; margin: 5rem auto; text-align: center; padding: 3rem; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md);">
                    <h2 style="font-size: 22px; color: #8E3838; margin-bottom: 0.5rem;">Timetable Publication Unavailable</h2>
                    <p style="font-size: 13.5px; color: var(--text-muted); margin-bottom: 1.5rem;">This timetable publication has been unpublished by university administration.</p>
                    <button class="btn-action btn-primary" onclick="switchView('publications')">Return to Publication Pipeline</button>
                </div>
                `;
                return;
            }

            const events = canonicalEventsData || [];
            const query = (activePublicFilter.query || "").toLowerCase().trim();
            const secFilter = activePublicFilter.section;
            const facFilter = activePublicFilter.faculty;
            const rmFilter = activePublicFilter.room;

            const filteredEvents = events.filter(e => {
                if (query) {
                    const txt = `${e.subject_name||e.subject||''} ${e.faculty_name||e.teacher||''} ${e.section_name||e.section||''} ${e.room_name||e.room||''}`.toLowerCase();
                    if (!txt.includes(query)) return false;
                }
                if (secFilter && !(e.section_name||e.section||'').includes(secFilter)) return false;
                if (facFilter && !(e.faculty_name||e.teacher||'').includes(facFilter)) return false;
                if (rmFilter && !(e.room_name||e.room||'').includes(rmFilter)) return false;
                return true;
            });

            let html = `
            <div style="max-width: 1560px; margin: 0 auto; padding: 1.5rem;">
                <!-- Public Header -->
                <div style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem;">
                            <h1 style="font-size: 22px; font-weight: 700; color: var(--brand-primary); margin: 0;">${pub.institution_name}</h1>
                            <span class="badge badge-certified">${pub.academic_period}</span>
                            <span class="badge ${pub.status === 'PUBLISHED' ? 'badge-certified' : 'badge-rule'}">${pub.status}</span>
                        </div>
                        <div style="font-size: 13px; color: var(--text-muted);">
                            ${pub.title} &bull; Effective: ${pub.effective_from} to ${pub.effective_to} &bull; Read-Only Snapshot
                        </div>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn-action" style="background: var(--bg-surface); border: 1px solid var(--border-default);" onclick="window.print()">Print Timetable</button>
                        <button class="btn-action" style="background: var(--bg-surface); border: 1px solid var(--border-default);" onclick="switchView('publications')">Exit Public Viewer</button>
                    </div>
                </div>

                <!-- View Selector Tabs & Search Strip -->
                <div style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div style="display: flex; gap: 0.5rem;">
                        ${['master', 'section', 'faculty', 'room', 'day', 'week'].map(vt => `
                            <button class="btn-action ${activePublicView === vt ? 'btn-primary' : ''}" style="${activePublicView !== vt ? 'background: var(--bg-surface); border: 1px solid var(--border-default); color: var(--text-primary);' : ''}" onclick="activePublicView='${vt}'; openPublicViewer('${pub.public_slug}')">
                                ${vt.toUpperCase()} VIEW
                            </button>
                        `).join('')}
                    </div>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="text" id="publicSearchInput" value="${activePublicFilter.query}" placeholder="Search subject, faculty, section..." style="padding: 0.4rem 0.65rem; border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-size: 12px; width: 220px;" onkeyup="if(event.key==='Enter'){ activePublicFilter.query=this.value; openPublicViewer('${pub.public_slug}'); }">
                        <button class="btn-action btn-primary" style="font-size: 12px;" onclick="activePublicFilter.query = (document.getElementById('publicSearchInput')||{}).value; openPublicViewer('${pub.public_slug}')">Filter</button>
                        <button class="btn-action" style="background: var(--bg-surface); border: 1px solid var(--border-default); font-size: 12px;" onclick="activePublicFilter={section:'',faculty:'',room:'',subject:'',day:'',query:''}; openPublicViewer('${pub.public_slug}')">Reset</button>
                    </div>
                </div>

                <!-- Public Timetable View Body -->
                <div style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow: hidden; padding: 1.25rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <div style="font-weight: 700; font-size: 14px;">Timetable Events (${filteredEvents.length} items)</div>
                        <div style="font-size: 12px; color: var(--text-muted);">2-Hour Laboratory Blocks preserved &bull; Multi-section synced</div>
                    </div>

                    <table class="master-table">
                        <thead>
                            <tr>
                                <th>Day</th>
                                <th>Time Window</th>
                                <th>Subject</th>
                                <th>Type</th>
                                <th>Faculty</th>
                                <th>Section / Group</th>
                                <th>Room & Building</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredEvents.slice(0, 100).map(ev => {
                                const isLab = ev.is_lab || (ev.duration && ev.duration > 1) || (ev.subject_name||'').toUpperCase().includes('LAB');
                                const dayName = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"][ev.day || 0] || `Day ${ev.day}`;
                                return `
                                <tr>
                                    <td style="font-weight: 600;">${dayName}</td>
                                    <td style="font-family: var(--font-mono); font-size: 11.5px;">${ev.start_time || '09:00 AM'} - ${ev.end_time || (isLab ? '11:00 AM' : '10:00 AM')}</td>
                                    <td style="font-weight: 600;">${ev.subject_name || ev.subject || 'Unassigned'}</td>
                                    <td>
                                        <span class="badge ${isLab ? 'badge-lab' : 'badge-theory'}">${isLab ? 'LAB (2 Hours)' : 'THEORY'}</span>
                                    </td>
                                    <td>${ev.faculty_name || ev.teacher || 'Unassigned'}</td>
                                    <td><strong>${ev.section_name || ev.section || 'Unassigned'}</strong></td>
                                    <td>
                                        <span class="badge ${ev.room_name === 'NO_ROOM' ? 'badge-noroom' : 'badge-neutral'}">${ev.room_name || ev.room || 'C202'}</span>
                                    </td>
                                </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            `;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
