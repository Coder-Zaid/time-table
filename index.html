        function runFullEditorValidation() {
            const errors = [];
            const warnings = [];

            // 1. Overlaps across all events
            for (let i = 0; i < editorEvents.length; i++) {
                const e1 = editorEvents[i];
                const slots1 = [];
                for (let s = 0; s < e1.duration; s++) slots1.push(e1.start_slot + s);

                // Closed Friday check
                if (e1.day_idx === 4 && slots1.some(s => s >= 4)) {
                    errors.push({
                        category: 'CLOSED_TIME',
                        message: `Event #${e1.event_id} ('${e1.subject}') violates Friday post-lunch closure (Slots 4-8).`,
                        event_id: e1.event_id
                    });
                }

                // Working hour bounds
                if (e1.start_slot < 0 || e1.start_slot + e1.duration > 9) {
                    errors.push({
                        category: 'OUTSIDE_WORKING_HOURS',
                        message: `Event #${e1.event_id} ('${e1.subject}') extends outside working hours (09:00 - 18:00).`,
                        event_id: e1.event_id
                    });
                }

                // Lab contiguity
                if (e1.is_lab && e1.duration !== 2) {
                    errors.push({
                        category: 'LAB_CONTINUITY',
                        message: `Lab Event #${e1.event_id} must have contiguous 2-hour duration.`,
                        event_id: e1.event_id
                    });
                }

                // Time Blocks check
                editorBlocks.forEach(b => {
                    if (b.day === e1.day_idx) {
                        const bSlots = [];
                        for (let s = 0; s < b.duration; s++) bSlots.push(b.start_slot + s);
                        if (slots1.some(s => bSlots.includes(s))) {
                            let applies = false;
                            if (b.scope === 'PROJECT') applies = true;
                            if (b.scope === 'SECTION' && e1.sections.includes(b.target_id)) applies = true;
                            if (b.scope === 'FACULTY' && e1.faculty.includes(b.target_id)) applies = true;
                            if (b.scope === 'ROOM' && e1.room === b.target_id) applies = true;

                            if (applies) {
                                errors.push({
                                    category: 'BLOCKED_SLOT',
                                    message: `Event #${e1.event_id} falls on blocked slot (${b.scope}: ${b.target_id || 'All'} - '${b.reason}').`,
                                    event_id: e1.event_id
                                });
                            }
                        }
                    }
                });

                // Overlaps with other events
                for (let j = i + 1; j < editorEvents.length; j++) {
                    const e2 = editorEvents[j];
                    if (e1.day_idx !== e2.day_idx) continue;

                    const slots2 = [];
                    for (let s = 0; s < e2.duration; s++) slots2.push(e2.start_slot + s);

                    const overlap = slots1.filter(s => slots2.includes(s));
                    if (overlap.length === 0) continue;

                    // Section collision
                    const sharedSec = e1.sections.filter(s => e2.sections.includes(s));
                    if (sharedSec.length > 0) {
                        errors.push({
                            category: 'SECTION_CONFLICT',
                            message: `Section ${sharedSec.join(', ')} double-booked: Event #${e1.event_id} & Event #${e2.event_id} on ${DAYS[e1.day_idx]} Slot ${overlap.join(', ')}.`,
                            event_id: e1.event_id
                        });
                    }

                    // Faculty collision
                    const sharedFac = e1.faculty.filter(f => e2.faculty.includes(f));
                    if (sharedFac.length > 0) {
                        errors.push({
                            category: 'FACULTY_CONFLICT',
                            message: `Faculty ${sharedFac.join(', ')} double-booked: Event #${e1.event_id} & Event #${e2.event_id} on ${DAYS[e1.day_idx]} Slot ${overlap.join(', ')}.`,
                            event_id: e1.event_id
                        });
                    }

                    // Room collision
                    if (e1.room !== 'NO_ROOM' && e2.room !== 'NO_ROOM' && e1.room === e2.room) {
                        errors.push({
                            category: 'ROOM_CONFLICT',
                            message: `Room ${e1.room} double-booked: Event #${e1.event_id} & Event #${e2.event_id} on ${DAYS[e1.day_idx]} Slot ${overlap.join(', ')}.`,
                            event_id: e1.event_id
                        });
                    }
                }

                // Soft constraint: lunch hour slot 4
                if (slots1.includes(4) && e1.day_idx !== 4) {
                    warnings.push({
                        category: 'LUNCH_WINDOW_WARNING',
                        message: `Event #${e1.event_id} ('${e1.subject}') scheduled during 01:00 PM - 02:00 PM lunch window.`,
                        event_id: e1.event_id
                    });
                }
            }

            editorValidationState = {
                valid: errors.length === 0,
                severity: errors.length > 0 ? 'ERROR' : (warnings.length > 0 ? 'WARNING' : 'PASS'),
                message: errors.length > 0 ? `${errors.length} Blocking Hard Constraint Error(s)` : (warnings.length > 0 ? `Schedule Valid with ${warnings.length} Soft Warning(s)` : 'All hard constraints satisfied.'),
                errors: errors,
                warnings: warnings
            };
        }

                            Save Draft
                        </button>
                        <button class="btn-action" onclick="handleEditorUndo()" ${editorUndoStack.length === 0 ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''} title="Undo last scheduling move">

                        </button>

                            + Create Version
                        </button>
                        <button class="btn-action" style="background: #FFF8E1; border: 1px solid #FFE082; color: #8D6E63;" onclick="openBlockTimeModal()">
                            + Block Time
                        </button>
                    </div>
                </div>

                <!-- Validation / Conflict Banner -->
                <div class="${editorValidationState.severity === 'ERROR' ? 'validation-banner-error' : (editorValidationState.severity === 'WARNING' ? 'validation-banner-warning' : 'validation-banner-pass')}" style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">

                    </div>
                    <div style="font-size: 11.5px; font-family: var(--font-mono);">

                <!-- Secondary Filter & View Switcher Bar -->

                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <span style="font-size: 12px; font-weight: 700; color: var(--text-secondary);">EDITOR VIEW:</span>
                        <div class="view-nav" style="margin: 0;">
                            <button class="view-btn ${editorActiveView === 'section' ? 'active' : ''}" onclick="setEditorView('section')">Section Grid</button>
                            <button class="view-btn ${editorActiveView === 'faculty' ? 'active' : ''}" onclick="setEditorView('faculty')">Faculty Grid</button>

                            <div style="display: flex; align-items: center; gap: 0.4rem; margin-left: 0.5rem;">
                                <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">${editorActiveView.toUpperCase()}:</label>
                                <select id="editorEntitySelect" onchange="editorSelectedEntity=this.value; renderCurrentView();" style="padding: 0.25rem 0.5rem; font-size: 12.5px; font-weight: 600;">
                                    ${(editorActiveView === 'section' ? sectionList : (editorActiveView === 'faculty' ? facultyList : roomList)).map(item => `

                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="text" placeholder="Search events (ID, Subject, Faculty)..." value="${editorSearchTerm}" oninput="editorSearchTerm=this.value; renderCurrentView();" class="search-input" style="width: 220px; padding: 0.3rem 0.6rem; font-size: 12px;">

                <div class="editor-canvas-layout">

                        <div class="panel-card" id="conflictPanel">

                                    <div style="color: var(--text-muted); font-style: italic; padding: 0.5rem 0;">No mutations recorded in this session.</div>
                                ` : editorHistory.slice().reverse().map(h => `
                                    <div style="background: var(--bg-surface-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.4rem 0.6rem;">

                                            <span style="color: var(--brand-primary);">${h.operation_type}</span>
                                            <span style="font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono);">${h.timestamp.split('T')[1].substring(0, 8)}</span>
                                        </div>
                                        <div style="color: var(--text-secondary);">
                                            Event #${h.event_id}: ${DAYS[h.before.day_idx]} Slot ${h.before.start_slot} &rarr; ${DAYS[h.after.day_idx]} Slot ${h.after.start_slot}
                                        </div>
                                        <div style="font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px;">
                                            By: ${h.user_id} · Op: ${h.operation_id}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            `;
            container.innerHTML = html;
            attachDragAndDropHandlers();
        }

        function setEditorView(view) {
            editorActiveView = view;
            renderCurrentView();
        }

        function renderEditorCanvasGrid() {
            if (editorActiveView === 'master') {
                return renderEditorMasterTable();
            }

            // Filter events according to active view entity
            let visibleEvents = editorEvents.filter(e => {
                if (editorSearchTerm) {
                    const st = editorSearchTerm.toLowerCase();
                    const matchId = String(e.event_id).includes(st);
                    const matchSub = (e.subject || '').toLowerCase().includes(st);
                    const matchFac = (e.faculty || []).some(f => f.toLowerCase().includes(st));
                    const matchSec = (e.sections || []).some(s => s.toLowerCase().includes(st));
                    if (!matchId && !matchSub && !matchFac && !matchSec) return false;
                }

                if (editorActiveView === 'section') return e.sections.includes(editorSelectedEntity);
                if (editorActiveView === 'faculty') return e.faculty.includes(editorSelectedEntity);
                if (editorActiveView === 'room') return e.room === editorSelectedEntity;
                return true;
            });

            let html = `
            <div class="timetable-shell" id="editorCanvasGrid">
                <div class="time-header-row">
                    <div class="time-header-cell" style="text-align: left; padding-left: 0.75rem;">DAY</div>
                    ${SLOTS.map(s => `
                        <div class="time-header-cell ${s.isCoreLunch ? 'lunch-core' : ''}">
                            ${s.label}
                        </div>
                    `).join('')}
                </div>
            `;

            DAYS.forEach((dayName, dayIdx) => {
                html += `<div class="day-lane">
                    <div class="day-indicator">
                        <span>${dayName}</span>
                        <span class="sub-date">${DATES[dayIdx]}</span>
                    </div>
                `;

                let t = 0;
                while (t < 9) {
                    const slotInfo = SLOTS[t];
                    const ev = visibleEvents.find(e => e.day_idx === dayIdx && e.start_slot === t);

                    // Check for time block in this slot
                    const block = editorBlocks.find(b => {
                        if (b.day !== dayIdx) return false;
                        const bSlots = [];
                        for (let s = 0; s < b.duration; s++) bSlots.push(b.start_slot + s);
                        if (!bSlots.includes(t)) return false;

                        if (b.scope === 'PROJECT') return true;
                        if (editorActiveView === 'section' && b.scope === 'SECTION' && b.target_id === editorSelectedEntity) return true;
                        if (editorActiveView === 'faculty' && b.scope === 'FACULTY' && b.target_id === editorSelectedEntity) return true;
                        if (editorActiveView === 'room' && b.scope === 'ROOM' && b.target_id === editorSelectedEntity) return true;
                        return false;
                    });

                    if (ev) {
                        const span = ev.duration;
                        const isLab = ev.is_lab;
                        const isRoomless = ev.is_roomless;
                        const isShared = ev.is_shared;
                        const isSelected = (ev.event_id === editorSelectedEventId);

                        html += `
                        <div class="grid-slot ${slotInfo.isCoreLunch ? 'core-lunch-slot' : ''}" style="grid-column: span ${span};" data-day="${dayIdx}" data-slot="${t}">
                            <div class="event-card ${isLab ? 'type-lab' : 'type-theory'} ${isRoomless ? 'is-roomless' : ''} ${isSelected ? 'is-selected' : ''}"
                                 draggable="true"
                                 id="evcard_${ev.event_id}"
                                 data-event-id="${ev.event_id}"
                                 onclick="selectEditorEvent(${ev.event_id})"
                                 tabindex="0"
                                 onkeydown="if(event.key==='Enter')selectEditorEvent(${ev.event_id})"
                                 title="Click to inspect · Drag to move">
                                <div>
                                    <div style="display: flex; gap: 4px; margin-bottom: 3px; align-items: center;">
                                        ${isLab ? '<span class="card-tag tag-lab">LAB (2h)</span>' : ''}
                                        ${isRoomless ? '<span class="card-tag tag-noroom">NO_ROOM</span>' : ''}
                                        ${isShared ? '<span class="card-tag tag-shared">SHARED</span>' : ''}
                                        <span style="font-size: 9.5px; font-family: var(--font-mono); color: var(--text-muted); margin-left: auto;">#${ev.event_id}</span>
                                    </div>
                                    <div class="card-subject">${ev.subject}</div>
                                </div>
                                <div class="card-meta">
                                    <div class="card-meta-line">
                                        <span class="card-faculty">${editorActiveView === 'faculty' ? ev.sections.join(', ') : (ev.faculty.length ? ev.faculty[0] : 'Unassigned')}</span>
                                        <span class="card-location">${isRoomless ? 'NO_ROOM' : ev.room.replace('Room no : ', '')}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        `;
                        t += span;
                    } else if (block) {
                        html += `
                        <div class="grid-slot slot-blocked" data-day="${dayIdx}" data-slot="${t}" title="Blocked: ${block.reason} (${block.scope})">
                            <div class="block-notice">
                                <strong>BLOCKED</strong><br>
                                <span style="font-size: 9.5px;">${block.reason}</span><br>
                                <button style="font-size: 9px; padding: 1px 4px; margin-top: 2px; cursor: pointer;" onclick="unblockTimeSlot('${block.block_id}')">Unblock</button>
                            </div>
                        </div>
                        `;
                        t += 1;
                    } else {
                        const isFridayPostLunch = (dayIdx === 4 && t >= 4);
                        if (isFridayPostLunch) {
                            html += `
                            <div class="grid-slot friday-closed-slot" data-day="${dayIdx}" data-slot="${t}">
                                <div class="friday-closed-notice">No Classes<br><span style="font-size: 9.5px; color: var(--text-muted); font-weight: 500;">Closed</span></div>
                            </div>
                            `;
                        } else {
                            html += `
                            <div class="grid-slot ${slotInfo.isCoreLunch ? 'core-lunch-slot' : ''} drop-target-slot" data-day="${dayIdx}" data-slot="${t}">
                                ${slotInfo.isCoreLunch ? '<div class="slot-lunch-notice">Lunch Break</div>' : ''}
                            </div>
                            `;
                        }
                        t += 1;
                    }
                }

                html += `</div>`;
            });

            html += `</div>`;
            return html;
        }

        function renderEditorMasterTable() {
            let filtered = editorEvents.filter(e => {
                if (editorSearchTerm) {
                    const st = editorSearchTerm.toLowerCase();
                    const matchId = String(e.event_id).includes(st);
                    const matchSub = (e.subject || '').toLowerCase().includes(st);
                    const matchFac = (e.faculty || []).some(f => f.toLowerCase().includes(st));
                    const matchSec = (e.sections || []).some(s => s.toLowerCase().includes(st));
                    if (!matchId && !matchSub && !matchFac && !matchSec) return false;
                }
                return true;
            });

            return `
            <div class="table-shell">
                <table class="institution-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Subject</th>
                            <th>Type</th>
                            <th>Duration</th>
                            <th>Section(s)</th>
                            <th>Faculty</th>
                            <th>Room</th>
                            <th>Day</th>
                            <th>Time</th>
                            <th>Actions</th>

                    </thead>
                    <tbody>
                        ${filtered.slice(0, 100).map(e => `
                            <tr class="${e.event_id === editorSelectedEventId ? 'is-selected' : ''}" style="cursor: pointer;" onclick="selectEditorEvent(${e.event_id})">

                                <td class="col-time">${e.duration}h</td>
                                <td>${e.sections.join(', ')}</td>
                                <td>${e.faculty.join(', ')}</td>
                                <td><span class="card-tag ${e.room === 'NO_ROOM' ? 'tag-noroom' : 'tag-shared'}">${e.room}</span></td>
                                <td class="col-time">${DAYS[e.day_idx]}</td>
                                <td class="col-time">Slot ${e.start_slot} (${SLOTS[e.start_slot].start})</td>
                                <td>
                                    <button class="btn-action" style="padding: 2px 6px; font-size: 11px;" onclick="event.stopPropagation(); selectEditorEvent(${e.event_id})">Inspect & Move</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
            `;
        }

        function selectEditorEvent(eventId) {
            editorSelectedEventId = eventId;
            renderCurrentView();
            // Ensure inspector in view on mobile/tablet
            const p = document.getElementById('eventInspectorPanel');
            if (p && window.innerWidth < 1280) p.scrollIntoView({ behavior: 'smooth' });
        }

        function renderEventInspectorContent(ev) {
            if (!ev) {
                return `
                <div style="color: var(--text-muted); font-size: 12.5px; padding: 1rem 0; text-align: center;">
                    Select an event on the canvas grid or master table to inspect constraints, adjust time, and manage room allocations.
                </div>
                `;
            }

            return `
            <div style="display: flex; flex-direction: column; gap: 0.75rem; font-size: 12.5px;">
                <div>
                    <label style="font-weight: 700; color: var(--text-secondary); font-size: 11px; text-transform: uppercase;">Subject Title</label>
                    <div style="font-weight: 600; color: var(--text-primary); font-size: 13.5px;">${ev.subject}</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                    <div>
                        <label style="font-weight: 700; color: var(--text-secondary); font-size: 11px; text-transform: uppercase;">Event Type</label>
                        <div><span class="card-tag ${ev.is_lab ? 'tag-lab' : 'tag-theory'}">${ev.event_type} (${ev.duration}h)</span></div>
                    </div>
                    <div>
                        <label style="font-weight: 700; color: var(--text-secondary); font-size: 11px; text-transform: uppercase;">Physical Room</label>
                        <div><span class="card-tag ${ev.room === 'NO_ROOM' ? 'tag-noroom' : 'tag-shared'}">${ev.room}</span></div>
                    </div>
                </div>

                <div>
                    <label style="font-weight: 700; color: var(--text-secondary); font-size: 11px; text-transform: uppercase;">Assigned Faculty</label>
                    <div style="color: var(--text-primary);">${ev.faculty.join(', ') || 'Unassigned'}</div>
                </div>

                <div>
                    <label style="font-weight: 700; color: var(--text-secondary); font-size: 11px; text-transform: uppercase;">Participating Section(s)</label>
                    <div style="color: var(--text-primary);">${ev.sections.join(', ')}</div>
                </div>

                <!-- Keyboard-Accessible Manual Reschedule Controls -->
                <div style="background: var(--bg-surface-subtle); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 0.75rem; margin-top: 0.25rem;">

        // =====================================================================
        // Scheduling Transaction & Mutation Logic
        // =====================================================================
        function executeEventMove(eventId, destDay, destSlot, newRoom = null) {
            const ev = editorEvents.find(e => e.event_id === eventId);
            if (!ev) {
                alert(`Error: Event #${eventId} not found.`);
                return false;
            }

            if (ev.is_frozen) {
                alert(`Operation Blocked: Event #${eventId} is frozen and cannot be moved.`);
                return false;
            }

            if (ev.is_pinned) {
                alert(`Operation Blocked: Event #${eventId} is pinned and cannot be moved.`);
                return false;
            }

            // Perform candidate validation
            const duration = ev.duration;
            const destRoom = newRoom !== null ? newRoom : ev.room;

            // 1. Working Hours Bounds
            if (destDay < 0 || destDay > 4) {
                alert(`Constraint Violation: Day index ${destDay} is outside working week (Mon-Fri).`);
                return false;
            }
            if (destSlot < 0 || destSlot + duration > 9) {
                alert(`Constraint Violation: Slot range [${destSlot}, ${destSlot + duration}] extends outside daily operating hours (09:00 - 18:00).`);
                return false;
            }

            // 2. Closed Friday Post-Lunch Rule
            if (destDay === 4) {
                const slots = [];
                for (let s = 0; s < duration; s++) slots.push(destSlot + s);
                if (slots.some(s => s >= 4)) {
                    alert(`Constraint Violation [CLOSED_TIME]: Institutional hard closure on Friday post-lunch (01:00 PM - 06:00 PM / Slots 4 to 8). Classes cannot be scheduled.`);
                    return false;
                }
            }

            // 3. Time Blocks Check
            const candidateSlots = [];
            for (let s = 0; s < duration; s++) candidateSlots.push(destSlot + s);

            for (const b of editorBlocks) {
                if (b.day === destDay) {
                    const bSlots = [];
                    for (let s = 0; s < b.duration; s++) bSlots.push(b.start_slot + s);
                    if (candidateSlots.some(s => bSlots.includes(s))) {
                        let applies = false;
                        if (b.scope === 'PROJECT') applies = true;
                        if (b.scope === 'SECTION' && ev.sections.includes(b.target_id)) applies = true;
                        if (b.scope === 'FACULTY' && ev.faculty.includes(b.target_id)) applies = true;
                        if (b.scope === 'ROOM' && destRoom === b.target_id) applies = true;

                        if (applies) {
                            alert(`Constraint Violation [BLOCKED_SLOT]: Destination slot is blocked (${b.scope}: ${b.target_id || 'All'} - '${b.reason}').`);
                            return false;
                        }
                    }
                }
            }

            // 4. Overlap Conflict Checks with Other Events
            for (const other of editorEvents) {
                if (other.event_id === eventId) continue;
                if (other.day_idx !== destDay) continue;

                const otherSlots = [];
                for (let s = 0; s < other.duration; s++) otherSlots.push(other.start_slot + s);
                const overlap = candidateSlots.filter(s => otherSlots.includes(s));
                if (overlap.length === 0) continue;

                // Section collision
                const secConflict = ev.sections.filter(s => other.sections.includes(s));
                if (secConflict.length > 0) {
                    alert(`Constraint Violation [SECTION_CONFLICT]: Section ${secConflict.join(', ')} already has Event #${other.event_id} ('${other.subject}') at Slot ${overlap.join(', ')}.`);
                    return false;
                }

                // Faculty collision
                const facConflict = ev.faculty.filter(f => other.faculty.includes(f));
                if (facConflict.length > 0) {
                    alert(`Constraint Violation [FACULTY_CONFLICT]: Faculty ${facConflict.join(', ')} already assigned to Event #${other.event_id} ('${other.subject}') at Slot ${overlap.join(', ')}.`);
                    return false;
                }

                // Room collision
                if (destRoom !== 'NO_ROOM' && other.room !== 'NO_ROOM' && destRoom === other.room) {
                    alert(`Constraint Violation [ROOM_CONFLICT]: Room ${destRoom} is already occupied by Event #${other.event_id} ('${other.subject}') at Slot ${overlap.join(', ')}.`);
                    return false;
                }
            }

            // All hard constraints PASS -> Commit Mutation Transaction
            const beforeState = JSON.parse(JSON.stringify(ev));
            const opId = "op_" + Math.random().toString(36).substring(2, 10);
            const now = new Date().toISOString();

            ev.day_idx = destDay;
            ev.day_name = DAYS[destDay];
            ev.start_slot = destSlot;
            ev.end_slot = destSlot + duration;
            ev.room = destRoom;
            ev.is_roomless = (destRoom === 'NO_ROOM');

            // Format 12H presentation
            const startH = SLOTS[destSlot].start;
            const endH = SLOTS[destSlot + duration - 1].end;
            ev.start_time = to12Hour(startH);
            ev.end_time = to12Hour(endH);

            const afterState = JSON.parse(JSON.stringify(ev));

            const opRecord = {
                operation_id: opId,
                user_id: currentAuthUser ? currentAuthUser.user_id : "usr_teach_003",
                timestamp: now,
                event_id: eventId,
                operation_type: "MOVE_EVENT",
                before: beforeState,
                after: afterState,
                validation_result: { valid: true, severity: "PASS" }
            };

            editorUndoStack.push(opRecord);
            editorRedoStack = [];
            editorHistory.push(opRecord);
            editorHasUnsaved = true;

            runFullEditorValidation();
            renderCurrentView();
            return true;
        }

        function applyManualEventMove(eventId) {

        function handleEditorUndo() {
            if (editorUndoStack.length === 0) return;
            const op = editorUndoStack.pop();
            const ev = editorEvents.find(e => e.event_id === op.event_id);
            if (ev) {
                Object.assign(ev, JSON.parse(JSON.stringify(op.before)));
                editorRedoStack.push(op);
                editorHasUnsaved = true;
                runFullEditorValidation();
                renderCurrentView();
            }
        }

        function handleEditorRedo() {
            if (editorRedoStack.length === 0) return;
            const op = editorRedoStack.pop();
            const ev = editorEvents.find(e => e.event_id === op.event_id);
            if (ev) {
                Object.assign(ev, JSON.parse(JSON.stringify(op.after)));
                editorUndoStack.push(op);
                editorHasUnsaved = true;
                runFullEditorValidation();
                renderCurrentView();
            }
        }

        // =====================================================================
        // HTML5 Drag-and-Drop Interaction Wiring
        // =====================================================================
        let draggedEventId = null;

        function attachDragAndDropHandlers() {
            // Drag source events
            document.querySelectorAll('.event-card[draggable="true"]').forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    draggedEventId = parseInt(card.getAttribute('data-event-id'));
                    card.classList.add('is-dragging');
                    e.dataTransfer.setData('text/plain', draggedEventId);
                    e.dataTransfer.effectAllowed = 'move';
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('is-dragging');
                    document.querySelectorAll('.grid-slot').forEach(s => {
                        s.classList.remove('drag-over-valid', 'drag-over-invalid');
                    });
                });
            });

            // Drop targets: slots
            document.querySelectorAll('.grid-slot').forEach(slot => {
                slot.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (!draggedEventId) return;

                    const day = parseInt(slot.getAttribute('data-day'));
                    const sIdx = parseInt(slot.getAttribute('data-slot'));

                    // Friday post-lunch or out of bounds is invalid
                    if (day === 4 && sIdx >= 4) {
                        slot.classList.add('drag-over-invalid');
                        slot.classList.remove('drag-over-valid');
                        e.dataTransfer.dropEffect = 'none';
                    } else {
                        slot.classList.add('drag-over-valid');
                        slot.classList.remove('drag-over-invalid');
                        e.dataTransfer.dropEffect = 'move';
                    }
                });

                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over-valid', 'drag-over-invalid');
                });

                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    slot.classList.remove('drag-over-valid', 'drag-over-invalid');
                    if (!draggedEventId) return;

                    const day = parseInt(slot.getAttribute('data-day'));
                    const sIdx = parseInt(slot.getAttribute('data-slot'));

                    executeEventMove(draggedEventId, day, sIdx);
                    draggedEventId = null;
                });
            });
        }

            { rule_type: "PREF_ADDITIONAL_BREAK", name: "Additional Break Preference", category: "PREFERENCE", scope: "PROJECT", desc: "Preserves mandatory 1h lunch break (01:00-02:00 PM) and keeps the after-break slot (02:00-03:00 PM) free." },
            { rule_type: "PREF_EARLY_FINISH", name: "Early Finish Preference", category: "PREFERENCE", scope: "PROJECT", desc: "Prefers schedules whose final class finishes earlier, ranked below late start." }
        ];

        function getInitialProjectPolicies(projectId) {
            return [
                { policy_id: "pol_" + projectId + "_1", name: "Section Overlap Protection", category: "HARD", rule_type: "NO_SECTION_CONFLICT", scope: "PROJECT", target_ids: [], enabled: true, priority: 1000, weight: null, status: "ACTIVE", parameters: {}, reason: "Default institutional hard rule" },
                { policy_id: "pol_" + projectId + "_2", name: "Faculty Overlap Protection", category: "HARD", rule_type: "NO_FACULTY_CONFLICT", scope: "PROJECT", target_ids: [], enabled: true, priority: 1000, weight: null, status: "ACTIVE", parameters: {}, reason: "Default institutional hard rule" },
                { policy_id: "pol_" + projectId + "_3", name: "Room Overlap Protection", category: "HARD", rule_type: "NO_ROOM_CONFLICT", scope: "PROJECT", target_ids: [], enabled: true, priority: 1000, weight: null, status: "ACTIVE", parameters: {}, reason: "Default institutional hard rule" },
                { policy_id: "pol_" + projectId + "_4", name: "Daily Working Hours", category: "HARD", rule_type: "WORKING_HOURS", scope: "PROJECT", target_ids: [], enabled: true, priority: 1000, weight: null, status: "ACTIVE", parameters: { allowed_start_slot: 0, allowed_end_slot: 8 }, reason: "09:00 - 18:00 operational boundary" },
                { policy_id: "pol_" + projectId + "_5", name: "Lab Contiguity & Duration", category: "HARD", rule_type: "LAB_CONTIGUITY", scope: "PROJECT", target_ids: [], enabled: true, priority: 1000, weight: null, status: "ACTIVE", parameters: { required_duration: 2 }, reason: "All labs require 2 contiguous slots" },
                { policy_id: "pol_" + projectId + "_6", name: "Friday Post-Lunch Closure", category: "HARD", rule_type: "CALENDAR_CLOSURE", scope: "PROJECT", target_ids: [], enabled: true, priority: 1000, weight: null, status: "ACTIVE", parameters: { days: [4], slots: [4, 5, 6, 7, 8], reason: "Friday sports and research meetings" }, reason: "Certified Institutional Friday Policy" },
                { policy_id: "pol_" + projectId + "_7", name: "Lunch Window Quality", category: "SOFT", rule_type: "LUNCH_WINDOW", scope: "PROJECT", target_ids: [], enabled: true, priority: 500, weight: 10.0, status: "ACTIVE", parameters: { start_slot: 3, end_slot: 5, required_break_hours: 1.0 }, reason: "Assures 13:00 - 14:00 break" },
                { policy_id: "pol_" + projectId + "_8", name: "Max Consecutive Hours (Section)", category: "SOFT", rule_type: "MAX_CONSECUTIVE_HOURS_SECTION", scope: "SECTION", target_ids: [], enabled: true, priority: 500, weight: 5.0, status: "ACTIVE", parameters: { max_hours: 3 }, reason: "Limits student fatigue" },
                { policy_id: "pol_" + projectId + "_9", name: "Preferred Morning Slots", category: "PREFERENCE", rule_type: "PREFERRED_SLOTS", scope: "FACULTY", target_ids: [], enabled: true, priority: 100, weight: 5.0, status: "ACTIVE", parameters: { slots: [1, 2] }, reason: "Instructor prime morning window" },
                { policy_id: "pol_" + projectId + "_10", name: "Late Start Priority", category: "PREFERENCE", rule_type: "PREF_LATE_START", scope: "PROJECT", target_ids: [], enabled: true, priority: 600, weight: 1.0, status: "ACTIVE", parameters: { preferred_start_slot: 1, priority: "HIGH" }, reason: "Makes 09:00-10:00 AM free and starts classes at 10:00 AM (P5 High)" },
                { policy_id: "pol_" + projectId + "_11", name: "Additional Break Preference", category: "PREFERENCE", rule_type: "PREF_ADDITIONAL_BREAK", scope: "PROJECT", target_ids: [], enabled: true, priority: 650, weight: 1.0, status: "ACTIVE", parameters: { preferred_total_free_hours: 2, additional_break_hours: 1, priority: "HIGH" }, reason: "Assures mandatory 1h lunch break + keeps 02:00-03:00 PM free (P4 Quality)" },
                { policy_id: "pol_" + projectId + "_12", name: "Early Finish Preference", category: "PREFERENCE", rule_type: "PREF_EARLY_FINISH", scope: "PROJECT", target_ids: [], enabled: true, priority: 450, weight: 0.7, status: "ACTIVE", parameters: { preferred_finish_slot: 7, priority: "MEDIUM" }, reason: "Encourages earlier finish, ranked below late start (P6 Medium)" }
            ];
        }

        // Ensure default optimization preferences are synchronized across all platform projects on load
        if (typeof platformProjects !== 'undefined' && Array.isArray(platformProjects)) {
            platformProjects.forEach(p => {
                if (!p.policies || p.policies.length === 0) {
                    p.policies = getInitialProjectPolicies(p.project_id);
                } else {
                    const existingTypes = new Set(p.policies.map(pol => pol.rule_type));
                    const defaults = getInitialProjectPolicies(p.project_id);
                    defaults.forEach(dp => {
                        if (!existingTypes.has(dp.rule_type)) {
                            p.policies.push(dp);
                        }
                    });
                }
            });
            try { localStorage.setItem('woxsen_timetable_projects', JSON.stringify(platformProjects)); } catch (e) {}
        }

        function openPolicyBuilder(projectId) {
            const proj = platformProjects.find(p => p.project_id === projectId);
            if (!proj) {
                alert("Error: Project not found.");
                return;
            }

            activePolicyProject = proj;

            // Load stored policies or initialize
            if (!proj.policies || proj.policies.length === 0) {
                proj.policies = getInitialProjectPolicies(projectId);
                proj.policy_version = proj.policy_version || "polver_v1";
            } else {
                // Ensure mandatory default optimization preferences are present & enabled
                const existingTypes = new Set(proj.policies.map(p => p.rule_type));
                const defaults = getInitialProjectPolicies(projectId);
                defaults.forEach(dp => {
                    if (!existingTypes.has(dp.rule_type)) {
                        proj.policies.push(dp);
                    }
                });
            }
            localStorage.setItem('woxsen_timetable_projects', JSON.stringify(platformProjects));
            projectPolicies = proj.policies;
            activePolicyTab = 'active';
            policyFilterCategory = 'ALL';
            policySearchTerm = '';
            runProjectPolicyValidation();

            switchView('policies');
        }

        function runProjectPolicyValidation() {
            const errors = [];
            const warnings = [];

            // Contradiction checks
            const secMax = projectPolicies.find(p => p.enabled && p.rule_type === 'MAX_DAILY_HOURS_SECTION');
            const secMin = projectPolicies.find(p => p.enabled && p.rule_type === 'MIN_DAILY_HOURS_SECTION');
            if (secMax && secMin) {
                const maxH = parseFloat(secMax.parameters.max_hours || 0);
                const minH = parseFloat(secMin.parameters.min_hours || 0);
                if (minH > maxH) {
                    errors.push(`Contradictory daily section hours: Min (${minH}h) exceeds Max (${maxH}h).`);
                }
            }

            const facMax = projectPolicies.find(p => p.enabled && p.rule_type === 'MAX_DAILY_HOURS_FACULTY');
            const facMin = projectPolicies.find(p => p.enabled && p.rule_type === 'MIN_DAILY_HOURS_FACULTY');
            if (facMax && facMin) {
                const maxH = parseFloat(facMax.parameters.max_hours || 0);
                const minH = parseFloat(facMin.parameters.min_hours || 0);
                if (minH > maxH) {
                    errors.push(`Contradictory daily faculty hours: Min (${minH}h) exceeds Max (${maxH}h).`);
                }
            }

            // Weight validations
            projectPolicies.forEach(p => {
                if (p.enabled) {
                    if (p.category === 'HARD' && p.weight !== null && p.weight !== undefined) {
                        errors.push(`Hard constraint '${p.name}' cannot have a weight assigned.`);
                    }
                    if ((p.category === 'SOFT' || p.category === 'PREFERENCE') && p.weight !== null && p.weight <= 0) {
                        errors.push(`Policy '${p.name}' weight must be a positive number (> 0).`);
                    }
                }
            });

            currentPolicyValidationResult = {
                valid: errors.length === 0,
                errors: errors,
                warnings: warnings
            };
        }

        function renderPoliciesView(container) {
            if (!activePolicyProject) {
                container.innerHTML = `<div style="padding: 2rem; text-align: center;">No project selected. <a onclick="switchView('projects')">Return to Projects</a></div>`;
                return;
            }

            runProjectPolicyValidation();

            const activeCount = projectPolicies.filter(p => p.enabled && p.status === 'ACTIVE').length;
            const hardCount = projectPolicies.filter(p => p.enabled && p.category === 'HARD').length;
            const softCount = projectPolicies.filter(p => p.enabled && p.category === 'SOFT').length;
            const prefCount = projectPolicies.filter(p => p.enabled && p.category === 'PREFERENCE').length;
            const draftCount = projectPolicies.filter(p => p.status === 'DRAFT').length;

            const canEdit = currentAuthUser && (currentAuthUser.role === 'SUPER_ADMIN' || currentAuthUser.role === 'TIMETABLE_ADMIN');

            let html = `
            <div class="policy-container">
                <!-- Top Hero & Breadcrumb -->
                <div class="policy-hero-bar">
                    <div>
                        <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 13px; margin-bottom: 4px;">
                            <a onclick="switchView('projects')" style="color: var(--brand-primary); font-weight: 600; cursor: pointer;">&larr; Timetable Projects</a>
                            <span style="color: var(--text-muted);">&rsaquo;</span>
                            <span style="font-weight: 700; color: var(--text-primary);">${activePolicyProject.project_name}</span>
                            <span class="card-tag tag-lab" style="font-family: var(--font-mono);">${activePolicyProject.policy_version || 'polver_v1'}</span>
                        </div>
                        <h2 style="font-size: 18px; font-weight: 700; color: var(--text-primary);">Constraint & Policy Builder</h2>
                        <p style="font-size: 13px; color: var(--text-secondary);">Define, prioritize, validate, and audit institutional scheduling constraints and quality preferences.</p>
                    </div>

                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <button class="btn-action" style="background: var(--bg-surface); border: 1px solid var(--border-default);" onclick="openPolicyImpactModal()">
                            Simulation Preview
                        </button>
                        ${canEdit ? `
                            <button class="btn-action" style="background: var(--brand-primary); color: #FFF; border: none; font-weight: 600;" onclick="openCreatePolicyModal()">
                                + Add Custom Rule
                            </button>
                            <button class="btn-action" style="background: var(--bg-surface); border: 1px solid var(--border-strong); font-weight: 600;" onclick="activatePolicyVersionSnapshot()">
                                Activate Policy Version
                            </button>
                        ` : `
                            <span class="badge badge-rule">Read-Only Mode (${currentAuthUser ? currentAuthUser.role : 'Guest'})</span>
                        `}
                    </div>
                </div>

                <!-- Validation Notice -->
                ${!currentPolicyValidationResult.valid ? `
                    <div class="validation-banner-error" style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>Policy Configuration Contradictions Detected:</strong>
                            <ul style="margin-left: 1.25rem; margin-top: 4px;">
                                ${currentPolicyValidationResult.errors.map(e => `<li>${e}</li>`).join('')}
                            </ul>
                        </div>
                        <span class="badge badge-hard">Activation Blocked</span>
                    </div>
                ` : `
                    <div class="validation-banner-pass" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>All active scheduling policies are structurally consistent. 0 contradictions detected.</span>
                        <span class="badge badge-certified">Validation: PASS</span>
                    </div>
                `}

                <!-- Metrics Dashboard Strip -->
                <div class="policy-metrics-grid">
                    <div class="policy-card-metric">
                        <span style="font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Active Rules</span>
                        <span style="font-size: 1.5rem; font-weight: 700; font-family: var(--font-mono); color: var(--text-primary);">${activeCount}</span>
                    </div>
                    <div class="policy-card-metric">
                        <span style="font-size: 11px; font-weight: 600; color: #991B1B; text-transform: uppercase;">Hard Constraints</span>
                        <span style="font-size: 1.5rem; font-weight: 700; font-family: var(--font-mono); color: #991B1B;">${hardCount}</span>
                    </div>
                    <div class="policy-card-metric">
                        <span style="font-size: 11px; font-weight: 600; color: #92400E; text-transform: uppercase;">Soft Constraints</span>
                        <span style="font-size: 1.5rem; font-weight: 700; font-family: var(--font-mono); color: #92400E;">${softCount}</span>
                    </div>
                    <div class="policy-card-metric">
                        <span style="font-size: 11px; font-weight: 600; color: #3730A3; text-transform: uppercase;">Preferences</span>
                        <span style="font-size: 1.5rem; font-weight: 700; font-family: var(--font-mono); color: #3730A3;">${prefCount}</span>
                    </div>
                    <div class="policy-card-metric">
                        <span style="font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Draft Uncommitted</span>
                        <span style="font-size: 1.5rem; font-weight: 700; font-family: var(--font-mono); color: var(--brand-primary);">${draftCount}</span>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <div class="policy-tabs" role="tablist" aria-label="Policy Views">
                    <button role="tab" aria-selected="${activePolicyTab === 'active'}" class="policy-tab-btn ${activePolicyTab === 'active' ? 'active' : ''}" onclick="activePolicyTab='active'; renderCurrentView();">Active Policies (${activeCount})</button>
                    <button role="tab" aria-selected="${activePolicyTab === 'draft'}" class="policy-tab-btn ${activePolicyTab === 'draft' ? 'active' : ''}" onclick="activePolicyTab='draft'; renderCurrentView();">Draft Policies (${draftCount})</button>
                    <button role="tab" aria-selected="${activePolicyTab === 'templates'}" class="policy-tab-btn ${activePolicyTab === 'templates' ? 'active' : ''}" onclick="activePolicyTab='templates'; renderCurrentView();">Policy Profiles & Templates</button>
                    <button role="tab" aria-selected="${activePolicyTab === 'registry'}" class="policy-tab-btn ${activePolicyTab === 'registry' ? 'active' : ''}" onclick="activePolicyTab='registry'; renderCurrentView();">Rule Registry (${BUILTIN_RULE_REGISTRY.length})</button>
                </div>

                <!-- Tab Body -->
                ${renderPolicyTabContent(canEdit)}
            </div>
            `;

            container.innerHTML = html;
        }

        function renderPolicyTabContent(canEdit) {
            if (activePolicyTab === 'templates') {
                return renderPolicyTemplatesTab(canEdit);
            }
            if (activePolicyTab === 'registry') {
                return renderRuleRegistryTab();
            }

            // Filter policy items
            let list = projectPolicies.filter(p => {
                if (activePolicyTab === 'active' && p.status !== 'ACTIVE') return false;
                if (activePolicyTab === 'draft' && p.status !== 'DRAFT') return false;
                if (policyFilterCategory !== 'ALL' && p.category !== policyFilterCategory) return false;
                if (policySearchTerm) {
                    const st = policySearchTerm.toLowerCase();
                    const matchName = (p.name || '').toLowerCase().includes(st);
                    const matchType = (p.rule_type || '').toLowerCase().includes(st);
                    const matchDesc = (p.description || '').toLowerCase().includes(st);
                    if (!matchName && !matchType && !matchDesc) return false;
                }
                return true;
            });

            return `
            <div style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 1rem;">
                <!-- Filter Bar -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="text" placeholder="Search policies by name, rule type..." value="${policySearchTerm}" oninput="policySearchTerm=this.value; renderCurrentView();" class="search-input" style="width: 260px; font-size: 12.5px;">
                        <select onchange="policyFilterCategory=this.value; renderCurrentView();" style="padding: 0.35rem 0.6rem; font-size: 12.5px;">
                            <option value="ALL" ${policyFilterCategory==='ALL'?'selected':''}>All Categories</option>
                            <option value="HARD" ${policyFilterCategory==='HARD'?'selected':''}>Hard Constraints</option>
                            <option value="SOFT" ${policyFilterCategory==='SOFT'?'selected':''}>Soft Constraints</option>
                            <option value="PREFERENCE" ${policyFilterCategory==='PREFERENCE'?'selected':''}>Preferences</option>
                        </select>
                    </div>

                    <div style="font-size: 12px; font-family: var(--font-mono); color: var(--text-secondary);">
                        Showing ${list.length} Policies
                    </div>
                </div>

                <!-- Policies Table -->
                <div class="table-shell">
                    <table class="institution-table">
                        <thead>
                            <tr>
                                <th>Policy Name</th>
                                <th>Rule Type</th>
                                <th>Category</th>
                                <th>Scope</th>
                                <th>Priority</th>
                                <th>Weight</th>
                                <th>State</th>
                                <th>Status</th>
                                ${canEdit ? '<th>Actions</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
                            ${list.length === 0 ? `
                                <tr><td colspan="${canEdit?9:8}" style="text-align: center; padding: 2rem; color: var(--text-muted);">No policies match the selected filter.</td></tr>
                            ` : list.map(p => `
                                <tr>
                                    <td style="font-weight: 600;">
                                        ${p.name}
                                        <div style="font-size: 11px; font-weight: normal; color: var(--text-secondary);">${p.reason || p.description || ''}</div>
                                    </td>
                                    <td class="col-id">${p.rule_type}</td>
                                    <td>
                                        <span class="badge ${p.category==='HARD'?'badge-hard':(p.category==='SOFT'?'badge-soft':'badge-preference')}">${p.category}</span>
                                    </td>
                                    <td class="col-time">${p.scope}</td>
                                    <td class="col-time">${p.priority}</td>
                                    <td class="col-time">${p.weight !== null ? p.weight : '—'}</td>
                                    <td>
                                        <span class="card-tag ${p.enabled ? 'tag-theory' : 'tag-noroom'}">${p.enabled ? 'ENABLED' : 'DISABLED'}</span>
                                    </td>
                                    <td class="col-time"><span class="badge badge-rule">${p.status}</span></td>
                                    ${canEdit ? `
                                        <td>
                                            <div style="display: flex; gap: 4px;">
                                                <button class="btn-action" style="padding: 2px 6px; font-size: 11px;" onclick="togglePolicyState('${p.policy_id}')">${p.enabled?'Disable':'Enable'}</button>
                                                <button class="btn-action" style="padding: 2px 6px; font-size: 11px;" onclick="duplicatePolicyRecord('${p.policy_id}')">Copy</button>
                                                <button class="btn-action" style="padding: 2px 6px; font-size: 11px; color: var(--color-closed-text);" onclick="archivePolicyRecord('${p.policy_id}')">Archive</button>
                                            </div>
                                        </td>
                                    ` : ''}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            `;
        }

        function renderPolicyTemplatesTab(canEdit) {
            return `
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div class="project-card">
                    <div class="project-card-header">
                        <div>
                            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                                <h3 style="font-size: 15px; font-weight: 700; color: var(--text-primary);">Woxsen Certified Profile (With Friday Closure)</h3>
                                <span class="project-badge-certified">Recommended Baseline</span>
                            </div>
                            <div style="font-size: 12.5px; color: var(--text-secondary);">
                                Standard institutional configuration matching certified Fall 2026 delivery: Monday - Friday 09:00 - 18:00 with institutional Hard Closure on Friday post-lunch (Slots 4 - 8 / 13:00 - 18:00).
                            </div>
                        </div>
                        <div>
                            ${canEdit ? `<button class="btn-action" style="background: var(--brand-primary); color: #FFF; border: none;" onclick="applyCertifiedProfileTemplate()">Apply Profile</button>` : ''}
                        </div>
                    </div>
                </div>

                <div class="project-card">
                    <div class="project-card-header">
                        <div>
                            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                                <h3 style="font-size: 15px; font-weight: 700; color: var(--text-primary);">Generic University Profile (No Friday Closure)</h3>
                                <span class="card-tag tag-lab">Open Weekdays</span>
                            </div>

                                Standard weekday university operations without early Friday closure. All 9 slots Monday through Friday remain open for scheduling.

                        </div>
                        <div>
                            ${canEdit ? `<button class="btn-action" onclick="applyGenericUniversityTemplate()">Apply Profile</button>` : ''}
                        </div>
                    </div>
                </div>
            </div>
            `;

        function renderRuleRegistryTab() {
            return `
            <div class="table-shell">
                <table class="institution-table">
                    <thead>
                        <tr>
                            <th>Machine Rule Type</th>
                            <th>Display Name</th>
                            <th>Default Category</th>
                            <th>Supported Scope</th>
                            <th>Description & Semantics</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${BUILTIN_RULE_REGISTRY.map(r => `
                            <tr>
                                <td class="col-id">${r.rule_type}</td>
                                <td style="font-weight: 600;">${r.name}</td>
                                <td><span class="badge ${r.category==='HARD'?'badge-hard':(r.category==='SOFT'?'badge-soft':'badge-preference')}">${r.category}</span></td>
                                <td class="col-time">${r.scope}</td>

                    </tbody>

            `;
        }

        // =====================================================================
        // Policy Mutation Actions & Modals
        // =====================================================================
        function togglePolicyState(policyId) {
            const p = projectPolicies.find(item => item.policy_id === policyId);
            if (!p) return;
            p.enabled = !p.enabled;
            persistProjectPolicies();
            renderCurrentView();
        }

        function duplicatePolicyRecord(policyId) {
            const p = projectPolicies.find(item => item.policy_id === policyId);
            if (!p) return;
            const copyObj = JSON.parse(JSON.stringify(p));
            copyObj.policy_id = "pol_" + Math.random().toString(36).substring(2, 9);
            copyObj.name = p.name + " (Copy)";
            copyObj.status = "DRAFT";
            projectPolicies.push(copyObj);
            persistProjectPolicies();
            activePolicyTab = 'draft';
            renderCurrentView();
        }

        function archivePolicyRecord(policyId) {
            const p = projectPolicies.find(item => item.policy_id === policyId);
            if (!p) return;
            p.status = "ARCHIVED";
            p.enabled = false;
            persistProjectPolicies();
            renderCurrentView();
        }

        function activatePolicyVersionSnapshot() {
            runProjectPolicyValidation();
            if (!currentPolicyValidationResult.valid) {
                alert(`Cannot Activate Policy Version:\n${currentPolicyValidationResult.errors.join('\n')}`);
                return;
            }

            const vNum = (parseInt((activePolicyProject.policy_version || 'v1').replace(/\D/g, '')) || 1) + 1;
            const newVer = "polver_v" + vNum;
            activePolicyProject.policy_version = newVer;
            projectPolicies.forEach(p => {
                if (p.status === 'DRAFT') p.status = 'ACTIVE';
            });
            persistProjectPolicies();
            alert(`Policy Version '${newVer}' activated successfully! New version snapshot frozen.`);
            activePolicyTab = 'active';
            renderCurrentView();
        }

        function applyCertifiedProfileTemplate() {
            if (confirm("Apply Woxsen Certified Profile? This includes Friday post-lunch hard closure (13:00 - 18:00).")) {
                activePolicyProject.policies = getInitialProjectPolicies(activePolicyProject.project_id);
                projectPolicies = activePolicyProject.policies;
                persistProjectPolicies();
                alert("Woxsen Certified Profile applied successfully.");
                renderCurrentView();
            }
        }

        function applyGenericUniversityTemplate() {
            if (confirm("Apply Generic University Profile? This removes early Friday closure.")) {
                activePolicyProject.policies = getInitialProjectPolicies(activePolicyProject.project_id).filter(p => p.rule_type !== 'CALENDAR_CLOSURE');
                projectPolicies = activePolicyProject.policies;

                alert("Error: Project not found.");

            activeFeasibilityProject = proj;

            // Load stored history if available
            try {
                const histStr = localStorage.getItem('woxsen_feasibility_runs_' + projectId);

                    if (feasibilityRunHistory.length > 0) {

                        activeFeasibilityResult = null;

                    feasibilityRunHistory = [];
                    activeFeasibilityResult = null;
                }

                feasibilityRunHistory = [];
                activeFeasibilityResult = null;

        function addDisruptionScenario() {
            const type = (document.getElementById('scenTypeSelect') || {}).value || 'HOLIDAY';

            const slotStr = (document.getElementById('scenSlotsInput') || {}).value || '';

            const reason = (document.getElementById('scenReasonInput') || {}).value || 'Scheduled Institutional Disruption';

            const newScen = {
                scenario_id: "scen_" + Math.random().toString(36).substring(2, 9),
                scenario_type: type,
                name: `${type.replace('_', ' ')} (Day ${day})`,
                description: reason,
                affected_days: [day],
                closed_slots: slots,
                affected_sections: [],
                affected_faculty: [],
                affected_rooms: [],
                affected_buildings: [],
                severity: "HIGH",
                reason: reason
            };

            activeScenarios.push(newScen);
            renderCurrentView();
        }

            activeScenarios = activeScenarios.filter(s => s.scenario_id !== scenId);

        function runRecoverySimulation() {
            if (!activeRecoveryProject) return;

            const userRole = currentAuthUser ? currentAuthUser.role : 'VIEWER';

                alert("Please add at least one calendar disruption scenario before running simulation.");

            isSimulationRunning = true;
            renderCurrentView();

            setTimeout(() => {
                const simId = "sim_" + Math.random().toString(36).substring(2, 9);
                const now = new Date().toISOString();

                // Compute deficit metrics from current project events
                const totalEvents = activeRecoveryProject.events_count || 598;
                const affectedDays = new Set(activeScenarios.flatMap(s => s.affected_days));
                const affectedCount = Math.round(totalEvents * (affectedDays.size / 5.0));
                const affectedHours = Math.round(affectedCount * 1.12);

                const result = {
                    simulation_id: simId,
                    source_project_id: activeRecoveryProject.project_id,
                    source_project_version_id: activeRecoveryProject.active_version || "v1",
                    source_timetable_fingerprint: "sha256:7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069",

                    result_fingerprint: "sha256:sim_" + Math.random().toString(36).substring(2, 16),

                isSimulationRunning = false;

                // Save to localStorage history
                try {
